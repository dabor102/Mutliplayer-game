<!DOCTYPE html>
<html>
<head>
    <title>Space Grids Tournament</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="space-background">
        <div class="stars" style="--offset-x: 37; --offset-y: 53;"></div>
        <div class="stars" style="--offset-x: 67; --offset-y: 89;"></div>
        <div class="stars" style="--offset-x: 101; --offset-y: 131;"></div>
        <div class="stars2" style="--offset-x: 7; --offset-y: 31;"></div>
        <div class="stars2" style="--offset-x: 233; --offset-y: 47;"></div>
        <div class="stars3" style="--offset-x: 59; --offset-y: 333;"></div>
        <div class="stars3" style="--offset-x: 0; --offset-y: 55;"></div>
    </div>

    <div id="login-form">
        <h1>Space Grids Tournament</h1>
        <p>... TEAM BUILDING GAME ...</p>
        <form id="login-form-element">
            <input type="text" id="player-name" placeholder="Enter your name" required>
            <button type="submit" id="join-game">Join Game</button>
        </form>
    </div>

    <div id="game-container" style="display: none;">
        <div class="console">
            <div class="console-header">
                <div class="console-title">Mission Control</div>
                <div class="console-controls">
                    <div class="control-button"></div>
                    <div class="control-button"></div>
                    <div class="control-button"></div>
                </div>
            </div>
            <div class="console-content">
                <div id="game-status-message"></div>
            </div>
        </div>

        <div id="player-role-box">
            Your role: <span id="player-role"></span>
        </div>

        <div class="mission-objective">
            <h2>Mission Objective</h2>
            <p>Welcome, <span id="player-name-display"></span>!</p>
            <div id="objective-section">
                <p>Current Level: <span id="current-level">1</span></p>
                <p>Mission: Destroy <span id="num-objects"></span> object(s)</p>
                <h3>Target Shapes:</h3>
                <div id="objective-display">
                    <div id="shape-display"></div>
                </div>
            </div>
        </div>

        <div class="grid">
            <div id="game-grid"></div>
        </div>

        <div class="reaming-clicks">
            <h2><span id="remaining-clicks"></h2></span>
        </div>

        <div class="reaming-time">
            <h2><span id="remaining-time"></h2></span>
        </div>

        <div id="player-stats">
            <h2>Player Stats</h2>
            <p>Turns Played: <span id="turns-played">0</span></p>
            <p>Total Hits: <span id="total-hits">0</span></p>
            <p>Total Misses: <span id="total-misses">0</span></p>
            <p>Total Clicks: <span id="total-clicks">0</span></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
